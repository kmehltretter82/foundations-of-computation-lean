name: Proof hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false

      - name: Check source and growth policy
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          scripts/check-naming-limits.py \
            --baseline scripts/naming-limits-baseline.json
          scripts/check-sorry-annotations.py FoC

          campaign_args=()
          while IFS= read -r -d '' campaign; do
            campaign_args+=(--campaign "$campaign")
          done < <(find compiler-campaigns -maxdepth 1 -name '*.json' -print0)

          scripts/check-compiler-growth.py \
            --baseline scripts/compiler-growth-baseline.json \
            --unreachable-allowlist \
              scripts/compiler-unreachable-allowlist.json \
            "${campaign_args[@]}"

      - name: Build Compiler facade
        run: lake build FoC.Computability.Compiler

      - name: Generate declaration review reports
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run scripts/export-declarations.lean \
            FoC.Computability.Compiler FoC.Computability \
            --module-prefix=FoC.Computability.Compiler \
            --raw-only --no-progress \
            > .lake/compiler-declarations.csv
          scripts/find-duplicate-declaration-types.py --kind theorem \
            .lake/compiler-declarations.csv \
            > .lake/compiler-duplicate-types.csv
          scripts/summarize-declaration-smells.py --kind theorem \
            .lake/compiler-declarations.csv \
            > .lake/compiler-declaration-smells.md
          scripts/check-compiler-growth.py \
            --baseline scripts/compiler-growth-baseline.json \
            --unreachable-allowlist \
              scripts/compiler-unreachable-allowlist.json \
            --declarations-csv .lake/compiler-declarations.csv \
            --duplicate-baseline \
              scripts/compiler-duplicate-types-baseline.json

      - name: Upload declaration review reports
        uses: actions/upload-artifact@v4
        with:
          name: compiler-declaration-review
          path: |
            .lake/compiler-duplicate-types.csv
            .lake/compiler-declaration-smells.md
