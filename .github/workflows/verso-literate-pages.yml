# Generated by: lake exe verso setup-literate
# To update after upgrading Verso, re-run the command above.

name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    # Allows manual deployment from the Actions tab
    workflow_dispatch:

# Permissions required for GitHub Pages deployment:
#   contents:read  — to check out the repository
#   pages:write    — to publish to GitHub Pages
#   id-token:write — for OIDC authentication with the Pages deployment API
#     (GitHub Pages uses short-lived OIDC tokens instead of long-lived secrets)
permissions:
    contents: read
    pages: write
    id-token: write

# Prevent concurrent deployments: if a new push arrives while a deployment
# is in progress, the new one waits (cancel-in-progress: false) rather than
# canceling the running deployment, which could leave the site in a broken state.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            # leanprover/lean-action handles:
            #   - Installing elan (the Lean version manager)
            #   - Reading lean-toolchain to select the right Lean version
            #   - Caching .lake for faster subsequent builds
            # We disable its default build/test since we only need :literateHtml.
            - uses: leanprover/lean-action@v1
              with:
                  build: false
                  test: false

            - name: Build literate site
              id: build
              run: echo "path=$(lake query :literateHtml)" >> "$GITHUB_OUTPUT"

            # Custom addition (not generated by `lake exe verso setup-literate`;
            # re-add after re-running that command): emit sitemap.xml and
            # robots.txt so search engines can discover and index every page.
            # Every Verso page is a directory-style index.html, so sitemap
            # entries are directory URLs with trailing slashes. The search UI
            # page is excluded because it is not content.
            - name: Generate sitemap and robots.txt
              run: |
                  python3 - "${{ steps.build.outputs.path }}" <<'EOF'
                  import sys
                  from pathlib import Path

                  site = Path(sys.argv[1])
                  base = "https://kmehltretter82.github.io/foundations-of-computation-lean/"

                  urls = []
                  for page in sorted(site.rglob("index.html")):
                      rel = page.relative_to(site).parent.as_posix()
                      if rel == "search":
                          continue
                      urls.append(base if rel == "." else f"{base}{rel}/")

                  lines = ['<?xml version="1.0" encoding="UTF-8"?>',
                           '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
                  lines += [f"  <url><loc>{u}</loc></url>" for u in urls]
                  lines.append("</urlset>")
                  (site / "sitemap.xml").write_text("\n".join(lines) + "\n")

                  (site / "robots.txt").write_text(
                      f"User-agent: *\nAllow: /\nSitemap: {base}sitemap.xml\n")

                  print(f"sitemap.xml: {len(urls)} URLs")
                  EOF

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ${{ steps.build.outputs.path }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
